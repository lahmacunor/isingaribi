<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İşin Garibi</title>
<meta name="description" content="Tarihin en tuhaf gerçek hikâyeleri. Uydurma yok: gerçekse gerçek, efsaneyse efsane.">
<meta property="og:title" content="İşin Garibi">
<meta property="og:description" content="Tarihin en tuhaf gerçek hikâyeleri. Uydurma yok: gerçekse gerçek, efsaneyse efsane.">
<meta property="og:image" content="profil.png">
<link rel="icon" href="profil.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --masa: #1e3a2c;        /* yeşil çuha masa */
    --masa-koyu: #142a1f;
    --dosya: #e3c587;       /* manila dosya */
    --dosya-kenar: #c9a45f;
    --murekkep: #221d17;
    --gercek: #1f8a3a;      /* damga yeşili */
    --kirmizi: #d7261e;     /* profil halkası */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, var(--masa) 0%, var(--masa-koyu) 100%);
    color: var(--murekkep);
    font-family: "Special Elite", "Courier New", monospace;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 56px 16px 120px;
  }
  .dosya {
    position: relative;
    width: 100%; max-width: 420px;
    background: var(--dosya);
    border-radius: 4px 14px 14px 14px;
    padding: 34px 26px 30px;
    box-shadow: 0 1px 0 var(--dosya-kenar) inset, 0 18px 40px rgba(0, 0, 0, .45);
  }
  /* dosya sekmesi: kanal adı burada */
  .sekme {
    position: absolute; left: 0; top: -34px;
    background: var(--dosya);
    padding: 8px 22px 4px;
    border-radius: 10px 10px 0 0;
    font-family: "Anton", Impact, sans-serif;
    font-size: 24px; letter-spacing: .02em;
    line-height: 1.2;
  }
  .kimlik { display: flex; gap: 18px; align-items: center; }
  .foto { position: relative; flex: none; }
  .foto img {
    width: 104px; height: 104px; border-radius: 50%;
    border: 4px solid var(--murekkep);
    display: block; background: var(--kirmizi);
  }
  /* ataş */
  .foto::before {
    content: ""; position: absolute; top: -16px; left: 18px;
    width: 18px; height: 46px;
    border: 3px solid #8e9aa3; border-radius: 10px;
    transform: rotate(-12deg);
  }
  .tanim { font-size: 17px; line-height: 1.5; margin: 0; }
  .kural {
    position: relative;
    margin: 22px 0 24px;
    padding-top: 40px;
    border-top: 2px dashed var(--dosya-kenar);
    font-size: 15px; line-height: 1.55;
  }
  .baglantilar { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .baglantilar a {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: var(--murekkep);
    background: #f4e4bd;
    border: 2px solid var(--murekkep);
    border-radius: 6px;
    padding: 13px 16px;
    font-size: 17px;
    box-shadow: 3px 3px 0 var(--murekkep);
  }
  .baglantilar a:hover { background: #fbf0d4; }
  .baglantilar a:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--murekkep); }
  .baglantilar a:focus-visible { outline: 3px solid var(--gercek); outline-offset: 3px; }
  .baglantilar svg { width: 26px; height: 26px; flex: none; }
  .baglantilar small { display: block; font-size: 13px; opacity: .75; margin-top: 2px; }
  /* asıl kapı: YouTube */
  .baglantilar .ana a {
    background: var(--kirmizi); color: #fff;
    font-family: "Anton", Impact, sans-serif; font-size: 24px; letter-spacing: .01em;
    padding: 16px 18px;
  }
  .baglantilar .ana a:hover { background: #e8352c; }
  .baglantilar .ana small { font-family: "Special Elite", monospace; font-size: 14px; opacity: .9; letter-spacing: 0; }
  /* damga baskısı: sayfanın tek hareketli anı */
  .baski {
    position: absolute; right: 4px; top: -26px;
    font-family: "Anton", Impact, sans-serif; font-size: 30px;
    color: var(--gercek);
    border: 4px solid var(--gercek); border-radius: 8px;
    padding: 2px 12px;
    transform: rotate(-14deg);
    opacity: .85;
    mix-blend-mode: multiply;
    animation: bas .35s cubic-bezier(.2, .9, .3, 1.3) .7s both;
  }
  .maskot {
    position: absolute; right: 14px; bottom: -92px; width: 84px;
    animation: zipla .5s ease-out .45s both;
  }
  @keyframes bas { from { opacity: 0; transform: rotate(-14deg) scale(2.2); } to { opacity: .85; transform: rotate(-14deg) scale(1); } }
  @keyframes zipla { 0% { transform: translateY(0); } 40% { transform: translateY(-26px) rotate(-8deg); } 100% { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .baski, .maskot { animation: none; } }
  footer { text-align: center; }
  @media (max-width: 380px) {
    .kimlik { flex-direction: column; text-align: center; }
    .baski { font-size: 24px; }
  }
</style>
</head>
<body>
<main class="dosya">
  <div class="sekme">İşin Garibi</div>
  <div class="kimlik">
    <div class="foto"><img src="profil.png" alt="İşin Garibi logosu: soru işaretli sayaç"></div>
    <p class="tanim">Tarihin en tuhaf gerçek hikâyeleri. Kaba çizimler, sağlam kaynaklar.</p>
  </div>

  <p class="kural"><span class="baski" aria-hidden="true">GERÇEK</span>Uydurma yok. Gerçekse gerçek, efsaneyse efsane diyoruz; her videonun kaynakları açıklamasında.</p>

  <ul class="baglantilar">
    <li class="ana">
      <a href="https://www.youtube.com/channel/UC_WlPwSPPTOmfSWafbowehw?sub_confirmation=1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8z"/><path fill="#d7261e" d="M9.7 15.1 15.5 12 9.7 8.9z"/></svg>
        <span>YouTube'da izle<small>Uzun videolar, her hafta</small></span>
      </a>
    </li>
    <li>
      <a href="https://www.instagram.com/isingaribibu/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="#221d17" stroke-width="2.2"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="#221d17" stroke-width="2.2"/><circle cx="17.4" cy="6.6" r="1.4" fill="#221d17"/></svg>
        <span>Instagram<small>Kısa hikâyeler</small></span>
      </a>
    </li>
    <li>
      <a href="https://www.tiktok.com/@isingaribibu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#221d17" d="M16.6 2h-3.4v13.3a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 1 0 5.4 6.2V8.4a8 8 0 0 0 4.7 1.5V6.5a4.7 4.7 0 0 1-4.7-4.5z"/></svg>
        <span>TikTok<small>Kısa hikâyeler</small></span>
      </a>
    </li>
  </ul>

  <img class="maskot" src="damga.png" alt="">
</main>
</body>
</html>
